<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Java Laboratory Index</title>
    
    <style>
        /* Blinking Border , index2 krna hai */
        @keyframes blinker {
            50% { border-color: transparent; }
        }

      
        body {
            font-family: 'Times New Roman', Times, serif; 
            margin: 0;
            padding: 10px; 
            background-color: #f0f0f0; 
            color: #000;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            min-height: 11in; 
            margin: 0;
            padding: 20px 15px; 
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); 
            box-sizing: border-box;
            position: relative; 
        }
        
        /* Background Image Styling */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            width: 100%; 
            max-width: 7in;
            height: auto;
            opacity: 0.40; /* Transparency 60% = Opacity 0.40 */
            pointer-events: none; 
            z-index: 0; 
        }

    
        .header-info {
            line-height: 1.3; 
            margin-bottom: 15px; 
            padding: 8px; 
            border: 1px solid #000; 
            position: relative; 
            z-index: 1; 
            font-size: 1.0em; 
        }

        .info-group-pair {
            display: flex;
            flex-direction: column; 
            width: 100%;
            margin-bottom: 5px; 
        }

        @media (min-width: 600px) {
            .info-group-pair {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .info-group {
            display: flex;
            align-items: baseline;
            margin-bottom: 5px;
        }
        
        .info-group-pair:nth-child(-n+2) > div {
            width: 100%; 
        }
        @media (min-width: 600px) {
            .info-group-pair:nth-child(-n+2) > div {
                width: 48%; 
            }
        }

        .info-group label {
            font-weight: bold; 
            flex-shrink: 0; 
            margin-right: 5px;
            text-transform: uppercase;
        }

     
        .header-info input {
            flex-grow: 1; 
            border: 2px solid red; 
            padding: 0 5px;
            font-family: inherit;
            font-size: 1.0em; 
            background-color: transparent; 
            min-width: 50px; 
            /* Blinking effect */
            animation: blinker 1s linear infinite; 
        }
        
      
        h1 {
            text-align: center;
            font-size: 1.3em; 
            margin: 5px 0 10px 0; 
            text-transform: uppercase;
            letter-spacing: normal;
            position: relative;
            z-index: 1;
            font-family: 'Algerian', serif; 
            text-decoration: underline; 
            font-weight: 900; 
        }

        /* Table */
        #assignment-index {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; 
            position: relative;
            z-index: 1;
        }

        #assignment-index th, 
        #assignment-index td {
            border: 1px solid #000;
            padding: 3px 5px; 
            font-size: 0.85em; 
            text-align: center;
    
            height: 23px; 
            background-color: transparent; 
        }
        
        #assignment-index td {
            min-height: 35px; 
        }

        /* Column Widths (Adjusted for mobile fit) */
        #assignment-index th:nth-child(1) { width: 10%; } 
        #assignment-index th:nth-child(2) { width: 40%; } 
        #assignment-index th:nth-child(3) { width: 17%; } 
        #assignment-index th:nth-child(4) { width: 15%; } 
        #assignment-index th:nth-child(5) { width: 18%; } 

        #assignment-index th {
            text-transform: uppercase;
            font-weight: bold;
            background-color: #ffffff;
        }
        
        #assignment-index td {
            text-align: left; 
        }

        #assignment-index td:first-child {
            text-align: center; 
        }
        
   
        .save-pdf-btn {
            position: fixed;
            top: 10px; 
            right: 10px;
            padding: 10px 18px; 
            background-color: #d9534f; 
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }
        .save-pdf-btn:hover {
            background-color: #c9302c;
        }

        /* Print Media Optimization for A4 - FINAL MARGINS */
        @media print {
            .save-pdf-btn {
                display: none; 
            }
            body {
                padding: 0;
                background-color: #fff;
            }
            .container {
                box-shadow: none;
                padding: 0; 
            }
         
            .header-info input {
                animation: none;
                border: none;
                background-color: transparent;
            }
           
            @page {
                size: A4; 
                margin: 10mm; 
            }
        }
    </style>
    <script>
        function savePdf() {
            // Trigger the print dialog
            window.print();
        }
    </script>
</head>
<body>
    <div class="container">
        
        <img src="bg.png" alt="College Watermark" class="watermark">
        
        <header class="header-info">
            
            <div class="info-group-pair">
                <div class="info-group">
                    <label for="student-name-input">NAME :</label>
                    <input type="text" id="student-name-input" value="Yuvraj Singh" title="Type Student Name here">
                </div>
                <div class="info-group">
                    <label for="subject-name-input">SUBJECT :</label>
                    <input type="text" id="subject-name-input" value="Java Laboratory" title="Type Subject Name here">
                </div>
            </div>
            
            <div class="info-group-pair">
                <div class="info-group">
                    <label for="class-name-input">CLASS :</label>
                    <input type="text" id="class-name-input" value="BCA 3rd SEM" title="Type Class here">
                </div>
                <div class="info-group">
                    <label for="faculty-name-input">FACULTY :</label>
                    <input type="text" id="faculty-name-input" value="Ms. Laxyata Bhati" title="Type Faculty Name here">
                </div>
            </div>

            <div class="info-group-pair">
                <div class="info-group">
                    <label for="year-input">YEAR :</label>
                    <input type="text" id="year-input" value="2025-26" title="Type Academic Year here">
                </div>
            </div>
        </header>

        <h1>INDEX</h1>

        <table id="assignment-index">
            <thead>
                <tr>
                    <th>S NO</th>
                    <th>TITLE</th>
                 
                    <th>DATE OF SUB</th>
                    <th>SIGN</th>
                </tr>
            </thead>
            <tbody>
               <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>

    <button class="save-pdf-btn" onclick="savePdf()">SAVE PDF</button>
</body>
</html>
